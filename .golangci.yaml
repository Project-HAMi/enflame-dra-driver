# please keep this alphabetized
version: "2"
run:
  tests: true
linters:
  enable:
    - asciicheck
    - contextcheck
    - forcetypeassert
    - gocritic
    - godot
    - misspell
    - staticcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # cgo status constants confuse gocritic dupSubExpr on ret != C.EFML_SUCCESS_V2.
      - path: pkg/gcu/efml/efml\.go
        linters:
          - gocritic
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Project-HAMi/enflame-dra-driver
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
