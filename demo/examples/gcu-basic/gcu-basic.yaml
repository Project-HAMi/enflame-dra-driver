apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  namespace: test-dra
  name: gcu-basic-claim
spec:
  devices:
    requests:
    - name: gcu
      exactly:
        deviceClassName: gcu.enflame.com
        count: 1
        selectors:
        - cel:
            expression: 'device.attributes["gcu.enflame.com"].uuid == "TR6W18220404"'
---
apiVersion: v1
kind: Pod
metadata:
  namespace: test-dra
  name: gcu-basic-pod
spec:
  restartPolicy: Never
  containers:
  - name: gcu-test
    image: ubuntu:24.04
    imagePullPolicy: IfNotPresent
    command:
    - bash
    - -c
    - |
      set -euo pipefail
      echo "=== device nodes ==="
      ls -la /dev/gcu* /dev/gcuctl
      echo "=== efsmi ==="
      efsmi -L
      echo "=== success ==="
      sleep 3600
    resources:
      claims:
      - name: gcu
  resourceClaims:
  - name: gcu
    resourceClaimName: gcu-basic-claim
