# Default values for enflame-dra-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

# deviceProfile describes the devices managed by the driver.
deviceProfile: "gcu"

# driverName uniquely identifies the driver within the cluster. When empty, its
# value is derived from the deviceProfile.
driverName: "gcu.enflame.com"

# deviceClass configures the DeviceClass the driver creates for its devices.
deviceClass:
  # extendedResourceName maps this DeviceClass to a classic extended resource
  # name (KEP-5004), so pods can request a device via `resources.limits` instead
  # of via a ResourceClaim. Defaults to "" so a
  # fresh install does not silently claim ownership of a name that may collide
  # with a real driver. The implicit form
  # `deviceclass.resource.kubernetes.io/<deviceClassName>` is always available.
  extendedResourceName: ""

imagePullSecrets: []
image:
  repository: dynamia-ai-registry.cn-hangzhou.cr.aliyuncs.com/artifacts/dynamia-ai/enflame-dra-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

kubeletPlugin:
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
    # for seamless rolling updates, maxSurge can be greater than 0.
    # See: https://pkg.go.dev/k8s.io/dynamic-resource-allocation/kubeletplugin#RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  # deviceHealth enables device health reporting (KEP-4680). Set to false to opt
  # out: the driver then advertises no health service to the kubelet and
  # WatchHealthStatus returns ErrHealthNotSupported.
  deviceHealth: true
  containers:
    init:
      securityContext: {}
      resources: {}
    plugin:
      securityContext:
        privileged: true
      resources: {}
      # Port running a gRPC health service checked by a livenessProbe.
      # Set to a negative value to disable the service and the probe.
      healthcheckPort: 51515
      # Port exposing Prometheus metrics at /metrics.
      # Set to a negative value to disable the metrics server.
      metricsPort: 8080

webhook:
  enabled: false
  servicePort: 443
  containerPort: 443
  priorityClassName: "system-cluster-critical"
  strategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  containers:
    webhook:
      securityContext:
        privileged: false
      resources: {}
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

resourceQuota:
  enabled: false
  pods: 10
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values:
      - system-node-critical
      - system-cluster-critical
