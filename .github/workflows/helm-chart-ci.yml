# Repository Helm CI adapted from dynamia-ai/.github workflow-templates/helm-chart-ci.
# Local contract: make verify-helm-chart (lint + template; no helm-docs/schema regen).
name: Helm Chart CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: helm-chart-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.2.3

jobs:
  changes:
    name: Detect Helm changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
    steps:
      - name: Filter changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            helm:
              - 'deployments/helm/**'
              - 'Makefile'
              - '**/Makefile'
              - 'Makefile.*'
              - '**/Makefile.*'
              - '**/*.mk'
              - 'common.mk'
              - 'hack/**'
              - 'scripts/**'
              - '.helmignore'
              - '**/.helmignore'
              - '.github/workflows/helm-chart-ci.yml'
              - '.github/workflows/release-helm-chart.yml'

  helm-checks:
    name: Run repository Helm checks
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Run local Helm CI contract
        run: make verify-helm-chart HELM=helm

  helm-chart-ci-required:
    name: Helm Chart CI required
    if: always()
    needs:
      - changes
      - helm-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Helm CI
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HELM_RELEVANT: ${{ needs.changes.outputs.helm }}
          HELM_CHECKS_RESULT: ${{ needs.helm-checks.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Helm change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          case "$HELM_RELEVANT" in
            false)
              echo "No Helm-relevant changes."
              exit 0
              ;;
            true) ;;
            *)
              echo "Helm change detection returned an invalid decision: $HELM_RELEVANT"
              exit 1
              ;;
          esac

          if [[ "$HELM_CHECKS_RESULT" != "success" ]]; then
            echo "Helm checks did not complete successfully: $HELM_CHECKS_RESULT"
            exit 1
          fi
