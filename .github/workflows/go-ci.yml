# Repository Go CI adapted from dynamia-ai/.github workflow-templates/go-ci.
# Local contract: make ci (EFML stub via CGO_ENABLED=0; no host libefml required).
name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with hack/tools/golangci-lint (go list -m ...).
  GOLANGCI_LINT_VERSION: v2.15.0
  GO_COVERAGE_FILE: cover.out

jobs:
  changes:
    name: Detect Go changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
    steps:
      - name: Filter changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'Makefile'
              - '**/Makefile'
              - 'Makefile.*'
              - '**/Makefile.*'
              - '**/*.mk'
              - 'common.mk'
              - '.golangci.yml'
              - '.golangci.yaml'
              - '.golangci.toml'
              - '.golangci.json'
              - '**/.golangci.yml'
              - '**/.golangci.yaml'
              - '**/.golangci.toml'
              - '**/.golangci.json'
              - 'hack/**'
              - 'scripts/**'
              - 'third_party/**'
              - 'vendor/**'
              - '.github/workflows/go-ci.yml'

  go-checks:
    name: Run repository Go checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
            hack/tools/golangci-lint/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run local Go CI contract
        run: make ci GOLANGCI_LINT=golangci-lint

      - name: Validate coverage output
        run: test -s "$GO_COVERAGE_FILE"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: ${{ env.GO_COVERAGE_FILE }}
          if-no-files-found: error
          retention-days: 7

  go-ci-required:
    name: Go CI required
    if: always()
    needs:
      - changes
      - go-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Go CI
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RELEVANT: ${{ needs.changes.outputs.go }}
          GO_CHECKS_RESULT: ${{ needs.go-checks.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Go change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          case "$GO_RELEVANT" in
            false)
              echo "No Go-relevant changes."
              exit 0
              ;;
            true) ;;
            *)
              echo "Go change detection returned an invalid decision: $GO_RELEVANT"
              exit 1
              ;;
          esac

          if [[ "$GO_CHECKS_RESULT" != "success" ]]; then
            echo "Go checks did not complete successfully: $GO_CHECKS_RESULT"
            exit 1
          fi
